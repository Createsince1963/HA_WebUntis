name: Untis-HUB
version: "0.4.0"
slug: webuntis_stundenplan
description: Untis-HUB timetable with the APK/PySide6-style interface for Home Assistant
url: https://github.com/Createsince1963/HA_WebUntis
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-clock
panel_title: Untis-HUB
ports:
  8099/tcp: 8099
webui: http://[HOST]:[PORT:8099]
options:
  server: demo.local
  school: demo
  username: Demo
  password: Demo
  auto_login: false
  days: 7
schema:
  server: str
  school: str
  username: str
  password: password
  auto_login: bool
  days: int(1,62)
